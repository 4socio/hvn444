<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amari - Profile</title>
    <style>
        /* Base Reset & Font */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #C0C0C0; /* Silver text */
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Blurred Nighttime City Skyline Background */
        .bg-image {
            position: absolute;
            top: -20px; left: -20px; right: -20px; bottom: -20px;
            /* High-quality Unsplash image of a night skyline */
            background-image: url('https://images.unsplash.com/photo-1477959858617-679af054b036?q=80&w=2000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            filter: blur(12px) brightness(0.6);
            z-index: -1;
        }

        /* Main Profile Card */
        .profile-card {
            background: rgba(15, 15, 15, 0.75); /* Translucent Black */
            border: 1px solid #404040;
            border-radius: 12px;
            padding: 35px 30px;
            width: 360px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        /* Header: PFP and Name */
        .header {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background-color: #2a2a2a;
            /* INSERT YOUR PROFILE PICTURE URL BELOW */
            background-image: url('YOUR_PROFILE_PICTURE_URL_HERE'); 
            background-size: cover;
            background-position: center;
            border: 2px solid #C0C0C0; /* Silver border */
        }

        .user-info {
            display: flex;
            flex-direction: column;
        }

        .username {
            font-size: 1.5rem;
            font-weight: bold;
            color: #ffffff;
            letter-spacing: 1px;
            text-shadow: 0 0 8px rgba(192, 192, 192, 0.5); /* Silver glow */
        }

        .badges {
            font-size: 0.85rem;
            margin-top: 5px;
            color: #a0a0a0;
        }

        /* Link Buttons */
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .link-btn {
            text-decoration: none;
            color: #C0C0C0;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid #505050;
            padding: 12px 15px;
            border-radius: 8px;
            text-align: center;
            font-size: 0.95rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
        }

        .link-btn:hover {
            background: #C0C0C0;
            color: #000000;
            border-color: #C0C0C0;
            box-shadow: 0 0 10px rgba(192, 192, 192, 0.3);
        }

        /* Footer Stats */
        .footer {
            margin-top: 10px;
            display: flex;
            justify-content: flex-start;
            gap: 15px;
            font-size: 0.85rem;
            color: #888888;
        }

        .footer-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }
    </style>
</head>
<body>

    <div class="bg-image"></div>

    <div class="profile-card">
        <!-- Header -->
        <div class="header">
            <div class="avatar"></div>
            <div class="user-info">
                <div class="username">amari</div>
                <div class="badges">✓ ✦ ♱</div>
            </div>
        </div>

        <!-- Links -->
        <div class="links-container">
            <a href="#" class="link-btn">Spotify</a>
            <a href="#" class="link-btn">YouTube</a>
            <a href="#" class="link-btn">Twitch</a>
            <a href="#" class="link-btn">Discord Server</a>
        </div>

        <!-- Footer -->
        <div class="footer">
            <div class="footer-item">
                <span>👁</span> 215,043
            </div>
            <div>|</div>
            <div class="footer-item">
                <span>📍</span> Fort Worth, TX
            </div>
        </div>
    </div>

</body>
</html>
